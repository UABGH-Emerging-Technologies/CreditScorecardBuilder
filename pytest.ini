[tool:pytest]
# pytest configuration for CreditScore project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers for categorizing tests
markers =
    regression: Regression tests for critical bugs
    integration: Integration tests across multiple components  
    unit: Unit tests for individual components
    slow: Tests that take a long time to run
    config: Tests related to configuration loading
    asa: Tests related to ASA detection functionality
    missing_data: Tests related to missing data handling
    variable_selection: Tests related to automated variable selection
    optbinning: Tests specific to OptBinning functionality

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:optbinning.*
    ignore::UserWarning:sklearn.*